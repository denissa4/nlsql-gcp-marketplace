# Populated by the Marketplace verification harness from apptest/deployer/schema.yaml.
image:
  repo: us-docker.pkg.dev/nlsql-public/nlsql/nlsql
  tag: "1.2.0"

# Name of the NLSQL release under test. The harness passes the same `name` it used
# for the install, so the tester can address the Service the main chart created.
targetRelease: ""

service:
  port: 80

# How long to wait for NLSQL to answer on /health before failing the test.
timeoutSeconds: 300

# Explicit Service name to probe. Leave empty to derive it from `targetRelease`
# the same way the NLSQL chart derives its own resource names.
targetService: ""
