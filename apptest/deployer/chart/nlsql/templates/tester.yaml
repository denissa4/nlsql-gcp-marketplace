{{- /*
Integration test for `mpdev verify`.

This file is overlaid onto the main chart in test mode only (see
/bin/create_manifests.sh in the deployer image), so it renders alongside the app
and can use the main chart's helpers and values directly. It is never rendered
for a customer install.
*/}}
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "nlsql.fullname" . }}-tester
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nlsql.labels" . | nindent 4 }}
  annotations:
    # Tells the Cloud Marketplace verification system which Pod to watch for the
    # test result. Exit status zero is a pass; anything else is a failure.
    marketplace.cloud.google.com/verification: test
spec:
  restartPolicy: Never
  containers:
    - name: tester
      # Reuse the application image rather than publishing a separate tool image:
      # it already ships Python, and it is the only image this listing publishes.
      image: {{ include "nlsql.image" . }}
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      command:
        - python3
        - -c
        - |
          import sys, time, urllib.request

          url = "http://{{ include "nlsql.fullname" . }}.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.service.port }}/health"
          deadline = time.time() + {{ .Values.tester.timeoutSeconds }}
          attempt = 0
          last = None

          while time.time() < deadline:
              attempt += 1
              try:
                  with urllib.request.urlopen(url, timeout=5) as r:
                      if r.status == 200:
                          print("PASS: {} returned 200 on attempt {}".format(url, attempt))
                          sys.exit(0)
                      last = "HTTP {}".format(r.status)
              except Exception as e:
                  last = repr(e)
              print("attempt {}: not ready yet ({})".format(attempt, last))
              time.sleep(10)

          print("FAIL: {} never returned 200 in time. Last result: {}".format(url, last))
          sys.exit(1)
