# Test-only schema overlay.
#
# `mpdev verify` — and Google's own Marketplace verification — merge this into
# /data/schema.yaml (see overlay_test_schema.py in the deployer image) before
# deploying in test mode. The merge REPLACES a property wholesale, and refuses to
# change its x-google-marketplace type.
#
# Verification runs unattended with no operator input, so every required property
# must be satisfiable from the schema alone. The production schema deliberately
# leaves the NLSQL account and database settings required-with-no-default, so
# they are given throwaway defaults here instead. None of this reaches the
# Marketplace UI or a customer install.
#
# The database host is deliberately unreachable: NLSQL's /health returns 200
# without a live database, so verification exercises the packaging rather than
# needing real credentials.
properties:
  nlsql.StaticEndPoint:
    type: string
    title: Public application URL
    # Must satisfy the production schema's ^https?://.+/$ pattern.
    default: "http://nlsql-verification.example.com/"

  credentials.ApiToken:
    type: string
    title: NLSQL API token
    default: "verification-not-a-real-token"
    x-google-marketplace:
      type: MASKED_FIELD

  database.DataSource:
    type: string
    title: Database host
    default: "nowhere.invalid"

  database.DbName:
    type: string
    title: Database name
    default: "verification"

  database.DbUser:
    type: string
    title: Database user
    default: "verification"

  credentials.DbPassword:
    type: string
    title: Database password
    default: "verification-not-a-real-password"
    x-google-marketplace:
      type: MASKED_FIELD

  tester.timeoutSeconds:
    type: integer
    title: Seconds the tester waits for NLSQL to answer on /health
    default: 600
