# Test-only schema overlay.
#
# `mpdev verify` merges this into /data/schema.yaml (see overlay_test_schema.py
# in the deployer image) before deploying in test mode. It adds properties the
# integration test needs; everything else comes from the main schema.
properties:
  tester.timeoutSeconds:
    type: integer
    title: Seconds the tester waits for NLSQL to answer on /health
    default: 600
