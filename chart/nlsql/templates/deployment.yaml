apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nlsql.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nlsql.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "nlsql.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- /* Roll the pods when non-secret configuration changes. */}}
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if .Values.reportingSecret }}
        checksum/ubbagent: {{ include (print $.Template.BasePath "/ubbagent-configmap.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "nlsql.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "nlsql.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: nlsql
          image: {{ include "nlsql.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "nlsql.fullname" . }}-config
            - secretRef:
                name: {{ include "nlsql.secretName" . }}
          {{- with .Values.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- if .Values.reportingSecret }}
        {{- /*
        Cloud Marketplace metering agent. Listens on the Pod's loopback interface,
        where NLSQL reports one unit per API request (UbbAgentEndpoint, set in the
        ConfigMap), and forwards aggregated usage to Service Control.

        AGENT_CONFIG_FILE and AGENT_LOCAL_PORT are read by the agent itself.
        AGENT_ENCODED_KEY and AGENT_CONSUMER_ID are ordinary names, referenced by
        the same names in the agent's config.yaml, which the sidecar expands from
        this environment at startup.
        */}}
        - name: ubbagent
          image: {{ include "nlsql.ubbagentImage" . }}
          imagePullPolicy: {{ .Values.ubbagent.image.pullPolicy }}
          env:
            - name: AGENT_CONFIG_FILE
              value: "/etc/ubbagent/config.yaml"
            - name: AGENT_LOCAL_PORT
              value: {{ .Values.metering.localPort | quote }}
            - name: AGENT_ENCODED_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.reportingSecret }}
                  key: reporting-key
            - name: AGENT_CONSUMER_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.reportingSecret }}
                  key: consumer-id
            {{- /* Without this the start script passes --no-state and the agent
            runs with persistence DISABLED, so a restart drops everything
            buffered but not yet sent. The volume below was always mounted; only
            the disk *endpoint* was using it. */}}
            - name: AGENT_STATE_DIR
              value: "/var/lib/ubbagent"
          {{- with .Values.metering.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: ubbagent-config
              mountPath: /etc/ubbagent
              readOnly: true
            - name: ubbagent-state
              mountPath: /var/lib/ubbagent
        {{- end }}
      {{- if .Values.reportingSecret }}
      volumes:
        - name: ubbagent-config
          configMap:
            name: {{ include "nlsql.fullname" . }}-ubbagent
        {{- /* The agent persists unsent reports here, so they survive a restart
        of the agent process. */}}
        - name: ubbagent-state
          emptyDir: {}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
