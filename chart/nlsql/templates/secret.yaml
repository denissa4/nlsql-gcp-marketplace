{{- if not .Values.credentials.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "nlsql.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nlsql.labels" . | nindent 4 }}
type: Opaque
stringData:
  ApiToken: {{ required "credentials.ApiToken is required. Supply it at install time, or point credentials.existingSecret at a Secret you created yourself." .Values.credentials.ApiToken | quote }}
  DbPassword: {{ required "credentials.DbPassword is required. Supply it at install time, or point credentials.existingSecret at a Secret you created yourself." .Values.credentials.DbPassword | quote }}
  {{- /* Only needed when the Microsoft Teams channel is in use.

  The key MUST be MicrosoftAppPassword. That is what bot/src/index.ts reads, and
  it is the name the Bot Framework SDK asserts on: with MicrosoftAppType
  SingleTenant it throws "MicrosoftAppPassword is required for SingleTenant in
  configuration." at startup and the bot crash-loops, so nothing ever listens on
  3978 and /api/messages returns 502. Under MultiTenant it fails more quietly -
  the process starts but cannot authenticate to Bot Framework.

  This shipped as `AppPassword` through 1.6.0, a name nothing in the application
  reads, so the Teams channel could never have worked. The Helm value is left as
  credentials.AppPassword because that is the published schema.yaml property and
  the Marketplace form contract; only the injected env var name changes. */}}
  MicrosoftAppPassword: {{ .Values.credentials.AppPassword | quote }}
{{- end }}
