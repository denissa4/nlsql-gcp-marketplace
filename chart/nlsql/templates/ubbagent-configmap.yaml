{{- if .Values.reportingSecret }}
{{- /*
Configuration for the Cloud Marketplace metering agent (ubbagent), which reports
usage to Google Service Control.

The $AGENT_ENCODED_KEY and $AGENT_CONSUMER_ID references below are NOT Helm
variables and must reach the agent verbatim: docker/ubbagent-start pipes this file
through `envsubst` with NO shell-format argument, so substitution is UNRESTRICTED.
Every other dollar sign in the rendered config.yaml - including inside its own `#`
comments - would also be expanded, to empty. Do not introduce one. Template
comments like this one are safe, because they never reach the ConfigMap at all.

Reference configuration:
https://github.com/GoogleCloudPlatform/marketplace-k8s-app-tools/blob/master/docs/billing-integration.md
*/}}
{{- $m := .Values.metering -}}

{{- /* Renamed in 1.9.0, when billing moved from an application-reported request
count to an agent-generated time metric. Fail loudly rather than letting a stale
--set land nowhere and silently bill the wrong thing. */}}
{{- if hasKey $m "bufferSeconds" }}
{{-   fail "metering.bufferSeconds was removed in 1.9.0. The time metric is passthrough - the heartbeat is already rate-limited, so there is nothing to buffer." }}
{{- end }}
{{- if not $m.metric }}
{{-   fail "metering.metric is required: it must match the Metric ID in Producer Portal > Pricing verbatim." }}
{{- end }}

{{- /* Derive the heartbeat value from the unit the metric is DEFINED in on the
backend. This removes the 60x-inflation trap from human hands: one heartbeat
covers `intervalSeconds` of runtime and must report that duration expressed in the
backend's unit - 60 when the unit is a second, 1 when it is a minute. Getting it
wrong scales every invoice by exactly that ratio, and nothing in ubbagent or
Service Control can detect it. */}}
{{- $unitSeconds := dict "second" 1 "minute" 60 "hour" 3600 "day" 86400 -}}
{{- $interval := int ($m.intervalSeconds | default 60) -}}
{{- if le $interval 0 }}
{{-   fail "metering.intervalSeconds must be greater than 0." }}
{{- end }}
{{- $unit := toString ($m.unit | default "second") -}}
{{- $value := 0 -}}
{{- if $m.unitsPerInterval }}
{{-   $value = int $m.unitsPerInterval }}
{{- else }}
{{-   if not (hasKey $unitSeconds $unit) }}
{{-     fail (printf "metering.unit must be one of second, minute, hour, day - got %q." $unit) }}
{{-   end }}
{{-   $spu := int (index $unitSeconds $unit) -}}
{{-   if ne (mod $interval $spu) 0 }}
{{-     fail (printf "metering.intervalSeconds (%d) is not a whole number of %ss, so the heartbeat cannot report an exact integer. Choose an interval divisible by %d, or set metering.unitsPerInterval explicitly." $interval $unit $spu) }}
{{-   end }}
{{-   $value = int (div $interval $spu) }}
{{- end }}
{{- if le $value 0 }}
{{-   fail "the derived heartbeat value is not positive; check metering.unit, intervalSeconds and unitsPerInterval." }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "nlsql.fullname" . }}-ubbagent
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nlsql.labels" . | nindent 4 }}
data:
  config.yaml: |
    # Credentials used to report usage. The key is the base64-encoded service
    # account JSON from the reporting Secret's `reporting-key` field.
    identities:
    - name: gcp
      gcp:
        encodedServiceAccountKey: $AGENT_ENCODED_KEY

    # The billable metric. Its name must match the Metric ID in Producer Portal
    # verbatim - the agent reports it as "<serviceName>/<name>", and a name the
    # pricing config does not define is rejected as permanent, dropped without
    # retry, and lost silently.
    #
    #   heartbeat        {{ $value }} unit(s) every {{ $interval }} seconds
    #   backend unit     {{ $unit }}
    #   730-hour month   {{ div (mul 2628000 $value) $interval }} units
    #   calendar day     {{ div (mul 86400 $value) $interval }} units in {{ div 86400 $interval }} reports
    #
    # If that 730-hour figure is not the number the Producer Portal plan is priced
    # against, every invoice is wrong by exactly that ratio. Read it back with
    # `kubectl get cm <release>-nlsql-ubbagent -o yaml` before publishing.
    metrics:
    - name: {{ $m.metric | quote }}
      type: int
      endpoints:
      {{- if $m.diskEndpoint }}
      - name: on_disk
      {{- end }}
      - name: servicecontrol
      # Passthrough, not aggregation. The heartbeat already emits at most one
      # report per interval, so buffering adds phase jitter and nothing else: the
      # aggregator's bucket boundary is anchored at its own creation, so buckets
      # would alternately hold 0, 1 or 2 heartbeats and Service Control would see
      # an irregular 0/60/120 stream instead of a clean 60 a minute. Same monthly
      # total, materially harder to reconcile.
      #
      # The braces are required: a bare `passthrough:` parses as null and the
      # agent exits with "missing buffering configuration".
      passthrough: {}

    endpoints:
    {{- if $m.diskEndpoint }}
    # Local copy of every report the agent accepts. Purely for debugging and for
    # evidencing reported usage; Service Control is the endpoint that bills.
    - name: on_disk
      disk:
        reportDir: /var/lib/ubbagent/reports
        expireSeconds: 3600
    {{- end }}
    - name: servicecontrol
      servicecontrol:
        identity: gcp
        serviceName: {{ $m.serviceName | quote }}
        consumerId: $AGENT_CONSUMER_ID

    # The agent generates its own usage - this is what makes the application
    # irrelevant to billing. Reported windows are contiguous from the moment the
    # process starts and are never backfilled across a restart, so a restart loses
    # up to one interval and can never double count.
    sources:
    - name: {{ printf "%s_heartbeat" (toString $m.metric) | quote }}
      heartbeat:
        metric: {{ $m.metric | quote }}
        intervalSeconds: {{ $interval }}
        value:
          # int64Value must be present. The agent validates the value's TYPE but
          # does not require one, so `value: {}` passes config validation and then
          # sends Service Control an operation carrying no value at all.
          int64Value: {{ $value }}
{{- end }}
