{{- if .Values.reportingSecret }}
{{- /*
Configuration for the Cloud Marketplace metering agent (ubbagent), which runs as
a sidecar alongside NLSQL and forwards usage to Google Service Control.

The $AGENT_ENCODED_KEY and $AGENT_CONSUMER_ID references below are NOT Helm
variables and must reach the agent verbatim: the ubbagent sidecar substitutes
them from its own environment at startup, which is how the reporting Secret's
values get in without being written into this ConfigMap. (Helm leaves `$` alone,
and the deployer's envsubst pass only ever touches /data/schema.yaml, never the
chart - see deployer/Dockerfile.)

Reference configuration:
https://github.com/GoogleCloudPlatform/marketplace-k8s-app-tools/blob/master/docs/billing-integration.md
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "nlsql.fullname" . }}-ubbagent
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nlsql.labels" . | nindent 4 }}
data:
  config.yaml: |
    # Credentials used to report usage. The key is the base64-encoded service
    # account JSON from the reporting Secret's `reporting-key` field.
    identities:
    - name: gcp
      gcp:
        encodedServiceAccountKey: $AGENT_ENCODED_KEY

    # The billable metric. The name must match the Metric ID in Producer Portal
    # verbatim. NLSQL reports this itself - one unit per API request - so there
    # is no `sources` section: nothing is generated by the agent.
    metrics:
    - name: {{ .Values.metering.metric }}
      type: int
      endpoints:
      {{- if .Values.metering.diskEndpoint }}
      - name: on_disk
      {{- end }}
      - name: servicecontrol
      aggregation:
        bufferSeconds: {{ .Values.metering.bufferSeconds }}

    endpoints:
    {{- if .Values.metering.diskEndpoint }}
    # Local copy of every aggregated report. Purely for debugging and for
    # evidencing reported usage; Service Control is the endpoint that bills.
    - name: on_disk
      disk:
        reportDir: /var/lib/ubbagent/reports
        expireSeconds: 3600
    {{- end }}
    - name: servicecontrol
      servicecontrol:
        identity: gcp
        serviceName: {{ .Values.metering.serviceName }}
        consumerId: $AGENT_CONSUMER_ID
{{- end }}
