# NLSQL Helm chart values.
#
# SECURITY: this file is published in a public repository. It must never contain
# credentials. Every secret value below is empty by default and MUST be supplied at
# install time (see the "Install the Application" section of README.md).

# -- Number of NLSQL replicas. See the "Scaling" section of README.md.
replicaCount: 1

image:
  # -- Image repository, including the registry host. Cloud Marketplace substitutes
  # this with the release's registry path (schema.yaml type REPO_WITH_REGISTRY).
  repo: us-docker.pkg.dev/nlsql-public/nlsql/nlsql
  # -- Image tag. Cloud Marketplace substitutes the release tag (schema.yaml type TAG).
  # For CLI installs, prefer pinning by digest instead - see `image.digest`.
  tag: "1.9.0"
  # -- Optional immutable digest, e.g. "sha256:abc123...". When set it takes precedence
  # over `image.tag`. Cloud Marketplace requires documented installs to pin by digest.
  digest: ""
  pullPolicy: IfNotPresent

# -- Image pull secrets. Not required for images in the customer-readable Marketplace
# registry; set only if you mirror the image into a private registry.
imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # -- Create a dedicated ServiceAccount for the NLSQL pods.
  create: true
  automount: true
  annotations: {}
  # -- Leave empty to use the generated name (<release>-nlsql).
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: false

# The image runs supervisord as root, fronted by nginx on port 80. Dropping all
# capabilities breaks it: nginx chowns /var/lib/nginx/body at startup (needs
# CHOWN), drops its workers to an unprivileged user (SETUID/SETGID) and binds a
# privileged port (NET_BIND_SERVICE). Drop everything else.
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
    add:
      - CHOWN
      - SETGID
      - SETUID
      - NET_BIND_SERVICE

service:
  type: ClusterIP
  # -- NLSQL serves HTTP directly on port 80.
  port: 80

ingress:
  # -- Expose NLSQL outside the cluster through a GCE (Google Cloud Load Balancer)
  # Ingress. Disabled by default: enable it and set `ingress.hosts` once you have a
  # hostname. See the "Expose the application" section of README.md.
  enabled: false
  className: "gce"
  annotations: {}
  #   kubernetes.io/ingress.global-static-ip-name: nlsql-ip
  #   networking.gke.io/managed-certificates: nlsql-cert
  hosts:
    - host: ""
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  limits:
    cpu: "1000m"
    memory: "512Mi"
  requests:
    cpu: "500m"
    memory: "256Mi"

# NLSQL starts supervisord and a Python app behind it, and on a cold node with a
# ~750MB image that can take a few minutes. The startupProbe holds the liveness
# probe off until the app first answers, so a slow start is not mistaken for a
# hung container and restarted into a crash loop.
startupProbe:
  httpGet:
    path: /health
    port: http
  periodSeconds: 10
  timeoutSeconds: 5
  # 60 x 10s = up to 10 minutes to come up.
  failureThreshold: 60

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 0
  periodSeconds: 20
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

nodeSelector: {}
tolerations: []
affinity: {}

# ---------------------------------------------------------------------------
# NLSQL application configuration
#
# Environment variable names are the application's own and use the container's
# PascalCase convention (ApiEndPoint, DbUser, ...). Do not normalise them.
# ---------------------------------------------------------------------------

nlsql:
  # -- NLSQL API endpoint for your integration channel.
  ApiEndPoint: "https://api.nlsql.com/googlesheet"

  # -- Public URL users reach NLSQL on. On GKE this is your Ingress hostname
  # (for example "https://nlsql.example.com/"). Required.
  StaticEndPoint: ""

database:
  # -- Database engine. One of: MSSQL, MySQL, PostgreSQL, Oracle, Snowflake.
  DatabaseType: "MSSQL"
  # -- Database host, reachable from the GKE cluster. Required.
  DataSource: ""
  # -- Database name. Required.
  DbName: ""
  # -- Database port. Defaults differ per engine (MSSQL 1433, MySQL 3306,
  # PostgreSQL 5432).
  DbPort: "1433"
  # -- Schema to query. Leave empty for the engine default.
  DbSchema: ""
  # -- Database user. Required.
  DbUser: ""
  # -- Require TLS on the database connection. Strongly recommended.
  ssl: "True"

# -- Microsoft Teams / Bot Framework channel. Leave the values empty to run NLSQL
# without the Teams channel.
teams:
  MicrosoftAppId: ""
  MicrosoftAppTenantId: ""
  # -- SingleTenant or MultiTenant. UserAssignedMSI is not supported on GKE: it
  # authenticates through an Azure managed identity, which has no equivalent here.
  MicrosoftAppType: "SingleTenant"

# ---------------------------------------------------------------------------
# Credentials
#
# Supply these at install time. They are written into a Kubernetes Secret and
# injected with envFrom; they are never rendered into a ConfigMap or a pod spec.
# ---------------------------------------------------------------------------
credentials:
  # -- Name of a pre-existing Secret holding ApiToken, AppPassword and DbPassword.
  # When set, the chart does not create a Secret and the three values below are
  # ignored. This is the recommended path - see README.md.
  existingSecret: ""

  # -- NLSQL API token. Required unless `credentials.existingSecret` is set.
  ApiToken: ""
  # -- Bot channel application password. Required only when the Teams channel is used.
  AppPassword: ""
  # -- Database password. Required unless `credentials.existingSecret` is set.
  DbPassword: ""

# ---------------------------------------------------------------------------
# Legacy Azure App Service variables.
#
# NLSQL was previously hosted on Azure App Service and the container still reads
# these names. They have no effect on GKE and are kept only so the container's
# environment matches across platforms. They are deliberately not exposed in the
# Cloud Marketplace UI (schema.yaml).
# ---------------------------------------------------------------------------
legacyEnv:
  DEBUG: "0"
  PYTHONUNBUFFERED: "1"
  DOCKER_ENABLE_CI: "true"
  DOCKER_REGISTRY_SERVER_URL: "https://index.docker.io/v1"
  WEBSITE_HTTPLOGGING_RETENTION_DAYS: "3"
  WEBSITES_ENABLE_APP_SERVICE_STORAGE: "false"

# ---------------------------------------------------------------------------
# Cloud Marketplace integration
# ---------------------------------------------------------------------------

# -- Marketplace reporting Secret name, created by the Marketplace deployer for
# usage-based entitlements only. Leave empty for flat-rate, BYOL and manual
# installs - Marketplace mints no reporting service account for those, so there
# is nothing to point at and nothing to meter.
#
# When set, the chart runs the Marketplace metering agent (ubbagent) as a sidecar
# and points NLSQL at it, so usage is reported to Google Service Control. When
# empty, neither the sidecar nor its configuration is rendered at all.
reportingSecret: ""

# -- Usage reporting, active only when `reportingSecret` is set.
#
# The plan is usage-based on a TIME metric: Google does not support flat monthly
# pricing for Kubernetes listings, only Free, BYOL and usage-based. The agent
# generates the usage itself from a heartbeat, so the application reports nothing
# and needs no code for this to bill.
#
# The agent runs as its own single-replica Deployment, NOT as a sidecar. Every
# sidecar would report the full interval under the same consumerId, so N replicas
# would bill N x the plan price and an autoscaler would make the invoice a
# function of the customer's traffic.
metering:
  # -- Service Control service name for this listing, from Producer Portal >
  # Overview. Must be the same value the published images carry in their
  # com.googleapis.cloudmarketplace.product.service.name annotation - Service
  # Control rejects reports sent to a service the reporting key is not for.
  serviceName: "nlsql-kubernetes.endpoints.nlsql-public.cloud.goog"

  # -- Metric ID from Producer Portal > Pricing, verbatim. The agent reports it as
  # "<serviceName>/<metric>"; a name the pricing config does not define is
  # rejected as permanent and dropped WITHOUT retry - silent lost revenue, not a
  # visible failure.
  metric: "instance_time"

  # -- The unit the metric is DEFINED in on the BACKEND (Producer Portal), not
  # here. One of: second, minute, hour, day.
  #
  # This is the most dangerous value in the chart. The heartbeat reports one
  # interval of runtime expressed in this unit, and the template DERIVES that
  # number rather than trusting anyone to type it:
  #
  #   unit=second, intervalSeconds=60  ->  int64Value 60   (correct)
  #   unit=minute, intervalSeconds=60  ->  int64Value 1    (correct)
  #
  # Reporting 60 against a minute-denominated metric inflates every invoice 60x;
  # reporting 1 against a second-denominated one collects 1/60th. Neither
  # produces an error anywhere in the stack: ubbagent validates the value's TYPE,
  # never its magnitude, and Service Control cannot know what a pod-second is.
  #
  # `second` is Google's recommendation for Kubernetes time metrics ("1 second,
  # the smallest possible"). The metric type is int, so a coarser unit forces
  # whole-unit quantisation and a pod that dies mid-unit reports nothing for it.
  unit: "second"

  # -- Heartbeat period. Google: "should not be too short to avoid excessive
  # reporting; should not be too long to avoid missing events in case of
  # unexpected restarts. The recommended value is 1 minute, or 60 seconds."
  # This is the reporting cadence only - price granularity comes from `unit`.
  # It is also the quantum of usage lost to each Pod restart (60s = $0.023).
  intervalSeconds: 60

  # -- Escape hatch: report this many units per interval instead of deriving it
  # from `unit`. Leave null. Only needed if a unit is billed per something other
  # than wall-clock time. Setting it silences the divisibility check and re-opens
  # the trap above.
  unitsPerInterval: null

  # -- Loopback port the agent listens on. Nothing reports to it under time-based
  # billing, but it also serves /status, which is the only way to observe
  # reporting health (lastReportSuccess, currentFailureCount).
  localPort: 4567

  # -- Also write every report to the Pod filesystem. Useful for debugging and for
  # evidencing reported usage to Google; not required in production.
  diskEndpoint: true

  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi

# -- The Cloud Marketplace metering agent (ubbagent), rebuilt from upstream
# source into this listing's registry (see ubbagent/Dockerfile). Marketplace
# requires every deployed image to live under the listing's own repository and to
# carry both the version and release-track tags - and scans them, which is why
# Google's own build is rebuilt rather than copied.
ubbagent:
  image:
    repo: us-docker.pkg.dev/nlsql-public/nlsql/ubbagent
    tag: "1.9.0"
    digest: ""
    pullPolicy: IfNotPresent
