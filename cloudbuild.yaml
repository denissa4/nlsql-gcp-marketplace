# Builds the Marketplace deployer image on Cloud Build.
#
# The deployer rebuilds helm and kubectl from source with a patched Go toolchain
# (see deployer/Dockerfile), which is far too slow to emulate on an arm64 laptop.
# Cloud Build runs it natively on amd64, the only architecture Marketplace
# accepts.
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file=deployer/Dockerfile
      - --tag=${_IMAGE}
      - .
images:
  - ${_IMAGE}
timeout: 3600s
options:
  machineType: E2_HIGHCPU_8
