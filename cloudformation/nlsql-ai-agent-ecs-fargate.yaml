AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  NLSQL AI Agent on Amazon ECS (Fargate). Deployment template for the AWS
  Marketplace container product. Creates one Fargate task behind an Application
  Load Balancer and a CloudFront HTTPS endpoint for Microsoft Teams, in subnets
  you already have, with Amazon Bedrock (Claude) through the task role.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: {default: Mode}
        Parameters: [Mode]
      - Label: {default: Network}
        Parameters: [VpcId, SubnetIds, AssignPublicIp, TaskSubnetIds]
      - Label: {default: Microsoft Teams bot}
        Parameters: [MicrosoftAppId, MicrosoftAppTenantId]
      - Label: {default: Credentials (AWS Secrets Manager)}
        Parameters: [CredentialsSecretArn, KmsKeyArn]
      - Label: {default: Language model (Amazon Bedrock)}
        Parameters: [LanguageModel, LanguageModelContext, Streaming]
      - Label: {default: Documents}
        Parameters: [ExistingDocumentsBucket]
      - Label: {default: Database (DocsAndSql mode only)}
        Parameters: [DatabaseType, DataSource, DbName, DbPort, DbSchema, DbUser, Warehouse]
      - Label: {default: Sizing}
        Parameters: [TaskCpu, TaskMemory, EphemeralStorage]
      - Label: {default: Image}
        Parameters: [ImageUri]
    ParameterLabels:
      Mode: {default: Mode}
      VpcId: {default: VPC}
      SubnetIds: {default: Subnets}
      AssignPublicIp: {default: Assign public IP to the task}
      TaskSubnetIds: {default: Private task subnets (optional)}
      MicrosoftAppId: {default: Microsoft App ID}
      MicrosoftAppTenantId: {default: Microsoft Entra tenant ID}
      CredentialsSecretArn: {default: Credentials secret ARN}
      KmsKeyArn: {default: Customer managed KMS key ARN (optional)}
      LanguageModel: {default: Claude model}
      LanguageModelContext: {default: System prompt (optional)}
      Streaming: {default: Stream answers}
      ExistingDocumentsBucket: {default: Existing documents bucket (optional)}
      DatabaseType: {default: Database engine}
      DataSource: {default: Database host}
      DbName: {default: Database name}
      DbPort: {default: Database port}
      DbSchema: {default: Database schema}
      DbUser: {default: Database user}
      Warehouse: {default: Snowflake warehouse}
      TaskCpu: {default: Task CPU units}
      TaskMemory: {default: Task memory (MiB)}
      EphemeralStorage: {default: Task ephemeral storage (GiB)}
      ImageUri: {default: Image URI}

Parameters:
  Mode:
    Type: String
    Default: DocsAndSql
    AllowedValues: [DocsAndSql, DocsOnly]
    Description: >-
      DocsAndSql answers from your documents and, through NLSQL, from your SQL
      database. DocsOnly answers from documents only and ignores the database
      parameters.

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC to deploy into.
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: >-
      Two or more public subnets in different Availability Zones. The load
      balancer is internet-facing, and the task needs outbound internet access.
  AssignPublicIp:
    Type: String
    Default: ENABLED
    AllowedValues: [ENABLED, DISABLED]
    Description: >-
      Keep ENABLED: the task reaches the internet through the public subnets'
      internet gateway. DISABLED only if those subnets give it another way out.
      Ignored when TaskSubnetIds is set.
  TaskSubnetIds:
    Type: CommaDelimitedList
    Default: ''
    Description: >-
      Optional. Private subnets (routed through a NAT gateway) for the task, for
      a database that only admits known IP addresses: allow the NAT gateway's
      Elastic IP. The load balancer stays in SubnetIds. Empty runs the task in
      SubnetIds with a public IP, which changes at every deployment.

  MicrosoftAppId:
    Type: String
    AllowedPattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
    ConstraintDescription: must be a GUID.
    Description: Application (client) ID of your single-tenant Azure Bot.
  MicrosoftAppTenantId:
    Type: String
    AllowedPattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
    ConstraintDescription: must be a GUID.
    Description: Microsoft Entra tenant ID the bot is registered in.

  CredentialsSecretArn:
    Type: String
    AllowedPattern: '^arn:aws[a-z-]*:secretsmanager:[a-z0-9-]+:[0-9]{12}:secret:.+$'
    ConstraintDescription: must be the full ARN of a Secrets Manager secret.
    Description: >-
      Full ARN of a Secrets Manager secret in this Region, with JSON keys
      AppPassword (bot client secret) and, for DocsAndSql, ApiToken and
      DbPassword.
  KmsKeyArn:
    Type: String
    Default: ''
    AllowedPattern: '^$|^arn:aws[a-z-]*:kms:[a-z0-9-]+:[0-9]{12}:key/[0-9a-fA-F-]+$'
    ConstraintDescription: must be empty or a KMS key ARN.
    Description: >-
      Leave empty unless the secret, or an existing documents bucket, is
      encrypted with a customer managed KMS key. The task is then allowed to
      decrypt with it.

  LanguageModel:
    Type: String
    Default: global.anthropic.claude-opus-5
    AllowedValues:
      - global.anthropic.claude-opus-5
      - global.anthropic.claude-opus-5-5
      - global.anthropic.claude-opus-4-8
      - global.anthropic.claude-sonnet-5
      - global.anthropic.claude-sonnet-5-5
      - global.anthropic.claude-sonnet-4-6
      - global.anthropic.claude-haiku-4-5-20251001-v1:0
    Description: >-
      Claude model, as an Amazon Bedrock global inference profile. Enable it in
      Amazon Bedrock in this account before launching.
  LanguageModelContext:
    Type: String
    Default: ''
    MaxLength: 4000
    Description: Optional system prompt for document answers. Empty uses the built-in prompt.
  Streaming:
    Type: String
    Default: 'false'
    AllowedValues: ['false', 'true']
    Description: Stream document answers into Teams as they are generated.

  ExistingDocumentsBucket:
    Type: String
    Default: ''
    AllowedPattern: '^$|^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$'
    ConstraintDescription: must be empty or an S3 bucket name.
    Description: >-
      Name of an S3 bucket in this Region that holds your documents. Leave empty
      to create a private, encrypted bucket that is kept when the stack is
      deleted.

  DatabaseType:
    Type: String
    Default: ''
    AllowedValues: ['', MSSQL, MySQL, PostgreSQL, Redshift, Snowflake]
    Description: DocsAndSql only. Database engine.
  DataSource:
    Type: String
    Default: ''
    Description: >-
      DocsAndSql only. Database host, reachable from the subnets. MSSQL on a
      non-default port takes host,port. Snowflake takes the account identifier.
  DbName:
    Type: String
    Default: ''
    Description: DocsAndSql only. Database name.
  DbPort:
    Type: String
    Default: ''
    AllowedPattern: '^$|^[0-9]{1,5}$'
    ConstraintDescription: must be empty or a port number.
    Description: >-
      DocsAndSql only. MySQL and PostgreSQL only; empty means 3306 or 5432.
      Ignored for MSSQL, Redshift (always 5439) and Snowflake.
  DbSchema:
    Type: String
    Default: ''
    Description: DocsAndSql only. Snowflake schema, required for Snowflake. Other engines use the user's default schema.
  DbUser:
    Type: String
    Default: ''
    Description: DocsAndSql only. A read-only user is recommended; only SELECT statements are issued.
  Warehouse:
    Type: String
    Default: ''
    Description: DocsAndSql only. Snowflake warehouse. Required for Snowflake, ignored otherwise.

  TaskCpu:
    Type: String
    Default: '4096'
    AllowedValues: ['2048', '4096']
    Description: Fargate CPU units. 4096 (4 vCPU) is recommended.
  TaskMemory:
    Type: String
    Default: '8192'
    AllowedValues: ['4096', '5120', '6144', '7168', '8192', '9216', '10240', '11264', '12288',
                    '13312', '14336', '15360', '16384', '17408', '18432', '19456', '20480',
                    '21504', '22528', '23552', '24576', '25600', '26624', '27648', '28672',
                    '29696', '30720']
    Description: Fargate memory in MiB. 2048 CPU takes 4096-16384; 4096 CPU takes 8192-30720.
  EphemeralStorage:
    Type: Number
    Default: 40
    MinValue: 21
    MaxValue: 200
    Description: Task disk in GiB. Holds the document index, charts and exports.

  ImageUri:
    Type: String
    Default: 709825985650.dkr.ecr.us-east-1.amazonaws.com/nlsql/ai-agent:1.0.0
    AllowedPattern: '^709825985650\.dkr\.ecr\.us-east-1\.amazonaws\.com/nlsql/ai-agent:[0-9]+\.[0-9]+\.[0-9]+$'
    ConstraintDescription: must be a published NLSQL AI Agent image from AWS Marketplace.
    Description: The AWS Marketplace image. Keep the default unless you are pinning another published version.

Rules:
  # Regions where the product is offered and every LanguageModel value is a
  # Bedrock global inference profile. Keep in step with the listing's Regions.
  SupportedRegion:
    Assertions:
      - Assert:
          Fn::Contains:
            - [us-east-1, us-east-2, us-west-1, us-west-2, ca-central-1, sa-east-1,
               eu-west-1, eu-west-2, eu-west-3, eu-central-1, eu-north-1,
               ap-south-1, ap-northeast-1, ap-northeast-2, ap-southeast-1, ap-southeast-2]
            - !Ref AWS::Region
        AssertDescription: >-
          NLSQL AI Agent is not supported in this Region. Use us-east-1,
          us-east-2, us-west-1, us-west-2, ca-central-1, sa-east-1, eu-west-1,
          eu-west-2, eu-west-3, eu-central-1, eu-north-1, ap-south-1,
          ap-northeast-1, ap-northeast-2, ap-southeast-1 or ap-southeast-2.

  DatabaseForDocsAndSql:
    RuleCondition: !Equals [!Ref Mode, DocsAndSql]
    Assertions:
      - Assert: !Not [!Equals [!Ref DatabaseType, '']]
        AssertDescription: DocsAndSql mode needs DatabaseType. Choose DocsOnly to run without a database.
      - Assert: !Not [!Equals [!Ref DataSource, '']]
        AssertDescription: DocsAndSql mode needs DataSource.
      - Assert: !Not [!Equals [!Ref DbName, '']]
        AssertDescription: DocsAndSql mode needs DbName.
      - Assert: !Not [!Equals [!Ref DbUser, '']]
        AssertDescription: DocsAndSql mode needs DbUser.

  SnowflakeSettings:
    RuleCondition: !And
      - !Equals [!Ref Mode, DocsAndSql]
      - !Equals [!Ref DatabaseType, Snowflake]
    Assertions:
      - Assert: !Not [!Equals [!Ref Warehouse, '']]
        AssertDescription: Snowflake needs Warehouse.
      - Assert: !Not [!Equals [!Ref DbSchema, '']]
        AssertDescription: Snowflake needs DbSchema.

  # Valid Fargate CPU/memory pairs.
  MemoryFor2048Cpu:
    RuleCondition: !Equals [!Ref TaskCpu, '2048']
    Assertions:
      - Assert:
          Fn::Contains:
            - ['4096', '5120', '6144', '7168', '8192', '9216', '10240', '11264', '12288',
               '13312', '14336', '15360', '16384']
            - !Ref TaskMemory
        AssertDescription: With TaskCpu 2048, TaskMemory must be 4096-16384.
  MemoryFor4096Cpu:
    RuleCondition: !Equals [!Ref TaskCpu, '4096']
    Assertions:
      - Assert:
          Fn::Contains:
            - ['8192', '9216', '10240', '11264', '12288', '13312', '14336', '15360', '16384',
               '17408', '18432', '19456', '20480', '21504', '22528', '23552', '24576',
               '25600', '26624', '27648', '28672', '29696', '30720']
            - !Ref TaskMemory
        AssertDescription: With TaskCpu 4096, TaskMemory must be 8192-30720.

Conditions:
  IsDocsAndSql: !Equals [!Ref Mode, DocsAndSql]
  IsDocsOnly: !Equals [!Ref Mode, DocsOnly]
  CreateDocumentsBucket: !Equals [!Ref ExistingDocumentsBucket, '']
  HasKmsKey: !Not [!Equals [!Ref KmsKeyArn, '']]
  HasLanguageModelContext: !Not [!Equals [!Ref LanguageModelContext, '']]
  HasTaskSubnets: !Not [!Equals [!Join ['', !Ref TaskSubnetIds], '']]

Resources:
  # Deleted with the stack, so a stack of the same name can be created again.
  LogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub /ecs/${AWS::StackName}
      RetentionInDays: 14

  # The source of truth for documents. The index is rebuilt from it at every
  # task start. Kept when the stack is deleted so documents are never lost with
  # it; only a failed first creation removes it.
  DocumentsBucket:
    Type: AWS::S3::Bucket
    Condition: CreateDocumentsBucket
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced

  DocumentsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Condition: CreateDocumentsBucket
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      Bucket: !Ref DocumentsBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt DocumentsBucket.Arn
              - !Sub '${DocumentsBucket.Arn}/*'
            Condition:
              Bool: {aws:SecureTransport: 'false'}

  # Pulls the image, writes logs and reads the one credentials secret.
  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: ecs-tasks.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: read-credentials-secret
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref CredentialsSecretArn
              - !If
                - HasKmsKey
                - Effect: Allow
                  Action: kms:Decrypt
                  Resource: !Ref KmsKeyArn
                  Condition:
                    StringEquals:
                      kms:ViaService: !Sub secretsmanager.${AWS::Region}.amazonaws.com
                - !Ref AWS::NoValue

  # The running container's own role, and its only AWS credentials.
  # RegisterUsage verifies the subscription and meters the task: without it the
  # container refuses to serve. Bedrock covers the global inference profiles
  # and the foundation models they route to, in any Region.
  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: ecs-tasks.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: marketplace-metering
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: aws-marketplace:RegisterUsage
                Resource: '*'
        - PolicyName: read-documents
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub
                  - arn:${AWS::Partition}:s3:::${Bucket}
                  - Bucket: !If [CreateDocumentsBucket, !Ref DocumentsBucket, !Ref ExistingDocumentsBucket]
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub
                  - arn:${AWS::Partition}:s3:::${Bucket}/*
                  - Bucket: !If [CreateDocumentsBucket, !Ref DocumentsBucket, !Ref ExistingDocumentsBucket]
              - !If
                - HasKmsKey
                - Effect: Allow
                  Action: kms:Decrypt
                  Resource: !Ref KmsKeyArn
                  Condition:
                    StringEquals:
                      kms:ViaService: !Sub s3.${AWS::Region}.amazonaws.com
                - !Ref AWS::NoValue
        - PolicyName: invoke-claude
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource:
                  - !Sub arn:${AWS::Partition}:bedrock:*::foundation-model/anthropic.*
                  - !Sub arn:${AWS::Partition}:bedrock:::foundation-model/anthropic.*
                  - !Sub arn:${AWS::Partition}:bedrock:*:${AWS::AccountId}:inference-profile/global.anthropic.*

  LoadBalancerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub ${AWS::StackName} load balancer
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        # Open to the internet so CloudFront can reach it, but the listener
        # answers 403 to anything without the CloudFront origin header.
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: HTTP from CloudFront (origin header enforced by the listener)

  ServiceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub ${AWS::StackName} task
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          SourceSecurityGroupId: !Ref LoadBalancerSecurityGroup
          Description: nginx from the load balancer only

  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Type: application
      # Internet-facing is required: CloudFront cannot reach an internal ALB.
      Scheme: internet-facing
      Subnets: !Ref SubnetIds
      SecurityGroups: [!Ref LoadBalancerSecurityGroup]
      LoadBalancerAttributes:
        # Longer than CloudFront's 60 s keep-alive, so the ALB never closes a
        # connection CloudFront is about to reuse.
        - {Key: idle_timeout.timeout_seconds, Value: '120'}
        - {Key: routing.http.drop_invalid_header_fields.enabled, Value: 'true'}

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref VpcId
      # The container runs as an unprivileged user, so nginx binds 8080, not 80.
      Port: 8080
      Protocol: HTTP
      TargetType: ip
      # 503 until the AWS Marketplace subscription is verified, so a task never
      # receives traffic before it is entitled.
      HealthCheckPath: /health
      HealthCheckIntervalSeconds: 30
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher: {HttpCode: '200-399'}
      TargetGroupAttributes:
        # Turns are acknowledged at once and answered out of band, so in-flight
        # requests are short and draining does not need the 300 s default.
        - {Key: deregistration_delay.timeout_seconds, Value: '60'}

  # Direct requests to the load balancer get 403. Only requests carrying the
  # header CloudFront adds, whose value is this stack's unique ID, are
  # forwarded.
  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: fixed-response
          FixedResponseConfig:
            StatusCode: '403'
            ContentType: text/plain
            MessageBody: Forbidden

  ListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref Listener
      Priority: 1
      Conditions:
        - Field: http-header
          HttpHeaderConfig:
            HttpHeaderName: X-Origin-Verify
            Values:
              - !Select [2, !Split ['/', !Ref AWS::StackId]]
      Actions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Ref AWS::StackName
      Cpu: !Ref TaskCpu
      Memory: !Ref TaskMemory
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      # The image is linux/amd64 only (msodbcsql17 has no arm64 build).
      RuntimePlatform:
        CpuArchitecture: X86_64
        OperatingSystemFamily: LINUX
      EphemeralStorage:
        SizeInGiB: !Ref EphemeralStorage
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: ai-agent
          Image: !Ref ImageUri
          Essential: true
          PortMappings:
            - {ContainerPort: 8080, Protocol: tcp}
          # Lets supervisord stop every process cleanly before SIGKILL.
          StopTimeout: 120
          Environment:
            - {Name: LanguageModelProvider,  Value: AWS}
            - {Name: LanguageModelName,      Value: !Ref LanguageModel}
            # Bedrock is called in the stack's own Region; the global profile
            # routes from there.
            - {Name: LanguageModelVersion,   Value: !Ref AWS::Region}
            - {Name: LanguageModelMaxTokens, Value: '16000'}
            - !If
              - HasLanguageModelContext
              - {Name: LanguageModelContext, Value: !Ref LanguageModelContext}
              - !Ref AWS::NoValue
            - {Name: Streaming,              Value: !Ref Streaming}
            # The embedding model is baked into the image; nothing is downloaded.
            - {Name: EmbeddingModelProvider, Value: HuggingFace}
            - {Name: EmbeddingModel,         Value: BAAI/bge-small-en-v1.5}
            - {Name: StoreHuggingFaceModels, Value: 'false'}
            - {Name: GraphRag,               Value: 'false'}
            - {Name: ConversationMemory,     Value: 'false'}
            - {Name: DEBUG,                  Value: 'false'}
            - {Name: PYTHONUNBUFFERED,       Value: '1'}
            - Name: AwsS3BucketName
              Value: !If [CreateDocumentsBucket, !Ref DocumentsBucket, !Ref ExistingDocumentsBucket]
            - {Name: AwsRegion,              Value: !Ref AWS::Region}
            # Chart and CSV links in answers point here.
            - {Name: StaticEndPoint,         Value: !Sub 'https://${Distribution.DomainName}'}
            - {Name: connections__serviceConnection__settings__clientId, Value: !Ref MicrosoftAppId}
            - {Name: connections__serviceConnection__settings__tenantId, Value: !Ref MicrosoftAppTenantId}
            # The image trusts only this code, so editing it does not buy
            # unmetered use; it can only stop the task.
            - {Name: AWS_MARKETPLACE_PRODUCT_CODE, Value: dwcy8qajiorcyvb3gtznytb5g}
            # Unset means both: NLSQL first, documents as the fallback.
            - !If
              - IsDocsOnly
              - {Name: TalkToDocs, Value: 'true'}
              - !Ref AWS::NoValue
            - !If [IsDocsAndSql, {Name: ApiEndPoint, Value: 'https://api.nlsql.com/googlesheet'}, !Ref AWS::NoValue]
            - !If [IsDocsAndSql, {Name: DatabaseType, Value: !Ref DatabaseType}, !Ref AWS::NoValue]
            - !If [IsDocsAndSql, {Name: DataSource, Value: !Ref DataSource}, !Ref AWS::NoValue]
            - !If [IsDocsAndSql, {Name: DbName, Value: !Ref DbName}, !Ref AWS::NoValue]
            - !If [IsDocsAndSql, {Name: DbPort, Value: !Ref DbPort}, !Ref AWS::NoValue]
            - !If [IsDocsAndSql, {Name: DbSchema, Value: !Ref DbSchema}, !Ref AWS::NoValue]
            - !If [IsDocsAndSql, {Name: DbUser, Value: !Ref DbUser}, !Ref AWS::NoValue]
            - !If [IsDocsAndSql, {Name: Warehouse, Value: !Ref Warehouse}, !Ref AWS::NoValue]
            # Snowflake: the connector reads the account from DataSource, but the
            # pre-flight check looks for Account by name.
            - !If [IsDocsAndSql, {Name: Account, Value: !Ref DataSource}, !Ref AWS::NoValue]
            # MySQL only: request TLS 1.2.
            - !If [IsDocsAndSql, {Name: ssl, Value: 'True'}, !Ref AWS::NoValue]
          # Injected by ECS at task start; never in the task definition.
          Secrets:
            - Name: connections__serviceConnection__settings__clientSecret
              ValueFrom: !Sub '${CredentialsSecretArn}:AppPassword::'
            - !If
              - IsDocsAndSql
              - {Name: ApiToken, ValueFrom: !Sub '${CredentialsSecretArn}:ApiToken::'}
              - !Ref AWS::NoValue
            - !If
              - IsDocsAndSql
              - {Name: DbPassword, ValueFrom: !Sub '${CredentialsSecretArn}:DbPassword::'}
              - !Ref AWS::NoValue
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ai-agent

  # HTTPS at the edge with CloudFront's own certificate. Bot Framework refuses
  # a plain HTTP messaging endpoint and the load balancer has no certificate.
  # Nothing is cached; the distribution only terminates TLS.
  Distribution:
    Type: AWS::CloudFront::Distribution
    DependsOn: ListenerRule
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub '${AWS::StackName} NLSQL AI Agent'
        PriceClass: PriceClass_100
        IPV6Enabled: false
        Origins:
          - Id: ai-agent-alb
            DomainName: !GetAtt LoadBalancer.DNSName
            OriginCustomHeaders:
              - HeaderName: X-Origin-Verify
                HeaderValue: !Select [2, !Split ['/', !Ref AWS::StackId]]
            CustomOriginConfig:
              HTTPPort: 80
              HTTPSPort: 443
              # HTTP to the load balancer inside AWS; viewers and Bot Framework
              # see CloudFront's certificate.
              OriginProtocolPolicy: http-only
              OriginSSLProtocols: [TLSv1.2]
              OriginKeepaliveTimeout: 60
              # Turns are acknowledged at once, so 60 s is ample.
              OriginReadTimeout: 60
        DefaultCacheBehavior:
          TargetOriginId: ai-agent-alb
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [DELETE, GET, HEAD, OPTIONS, PATCH, POST, PUT]
          CachedMethods: [GET, HEAD]
          Compress: false
          MinTTL: 0
          DefaultTTL: 0
          MaxTTL: 0
          ForwardedValues:
            QueryString: true
            Headers: [Authorization, Host, Content-Type, Origin, Referer]
            Cookies:
              Forward: all
        ViewerCertificate:
          CloudFrontDefaultCertificate: true
          MinimumProtocolVersion: TLSv1.2_2021

  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Ref AWS::StackName

  # Exactly one task: charts and exports live on the task's disk, NLSQL keeps
  # conversation state in the process, and Bot Framework carries no ALB cookie.
  Service:
    Type: AWS::ECS::Service
    DependsOn: ListenerRule
    Properties:
      Cluster: !Ref Cluster
      LaunchType: FARGATE
      PlatformVersion: LATEST
      DesiredCount: 1
      TaskDefinition: !Ref TaskDefinition
      # Covers document indexing at start-up before ALB health counts.
      HealthCheckGracePeriodSeconds: 300
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        # A task that keeps stopping (for example, not subscribed) fails the
        # deployment and rolls back instead of retrying for hours.
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      NetworkConfiguration:
        AwsvpcConfiguration:
          Subnets: !If [HasTaskSubnets, !Ref TaskSubnetIds, !Ref SubnetIds]
          SecurityGroups: [!Ref ServiceSecurityGroup]
          AssignPublicIp: !If [HasTaskSubnets, DISABLED, !Ref AssignPublicIp]
      LoadBalancers:
        - ContainerName: ai-agent
          ContainerPort: 8080
          TargetGroupArn: !Ref TargetGroup

Outputs:
  MessagingEndpoint:
    Description: Paste into your Azure Bot, Settings, Configuration, Messaging endpoint.
    Value: !Sub 'https://${Distribution.DomainName}/api/messages'
  HealthCheck:
    Description: 200 once the AWS Marketplace subscription is verified, 503 before.
    Value: !Sub 'https://${Distribution.DomainName}/health'
  ReadinessCheck:
    Description: 200 with status ready once documents are indexed, 503 with a status otherwise.
    Value: !Sub 'https://${Distribution.DomainName}/ready'
  DocumentsBucket:
    Description: Upload documents here, then force a new deployment of the service.
    Value: !If [CreateDocumentsBucket, !Ref DocumentsBucket, !Ref ExistingDocumentsBucket]
  ClusterName:
    Value: !Ref Cluster
  ServiceName:
    Value: !GetAtt Service.Name
  LogGroupName:
    Value: !Ref LogGroup
