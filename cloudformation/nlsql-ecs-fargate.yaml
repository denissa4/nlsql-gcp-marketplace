AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  NLSQL on Amazon ECS (Fargate). Deployment template for the AWS Marketplace
  container product. Creates a Fargate service behind an Application Load
  Balancer, in subnets you already have.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: {default: Network}
        Parameters: [VpcId, SubnetIds, LoadBalancerScheme]
      - Label: {default: NLSQL image}
        Parameters: [ImageUri]
      - Label: {default: Database}
        Parameters: [DatabaseType, DataSource, DbName, DbPort, DbSchema, DbUser, Warehouse]
      - Label: {default: Credentials (AWS Secrets Manager)}
        Parameters: [CredentialsSecretArn]
      - Label: {default: Microsoft Teams channel}
        Parameters: [MicrosoftAppId, MicrosoftAppTenantId, MicrosoftAppType]
      - Label: {default: Sizing}
        Parameters: [TaskCpu, TaskMemory, DesiredCount]

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC to deploy into.
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Two or more subnets. They must be able to reach your database and the internet (NAT or public) to call the AWS Marketplace Metering Service.
  LoadBalancerScheme:
    Type: String
    Default: internet-facing
    AllowedValues: [internet-facing, internal]

  ImageUri:
    Type: String
    Description: >-
      The NLSQL image from AWS Marketplace. Leave the default unless you are
      pinning an older published version.
    Default: 709825985650.dkr.ecr.us-east-1.amazonaws.com/nlsql/nlsql:1.0.2

  DatabaseType:
    Type: String
    Default: MSSQL
    AllowedValues: [MSSQL, MySQL, PostgreSQL, Redshift, Snowflake]
  DataSource:
    Type: String
    Description: Database host, reachable from the subnets above.
  DbName:
    Type: String
  DbPort:
    Type: String
    Default: '1433'
    Description: MSSQL 1433, MySQL 3306, PostgreSQL 5432, Redshift 5439. Ignored for Snowflake.
  DbSchema:
    Type: String
    Default: ''
    Description: Leave empty for the engine default. Required when DatabaseType is Snowflake.

  Warehouse:
    Type: String
    Default: ''
    Description: >-
      Snowflake warehouse name. Required when DatabaseType is Snowflake, ignored
      otherwise. For Snowflake, put your account identifier in DataSource.
  DbUser:
    Type: String
    Description: A read-only user is recommended - NLSQL only issues SELECT statements.

  CredentialsSecretArn:
    Type: String
    Description: >-
      ARN of an AWS Secrets Manager secret holding the sensitive values as JSON
      keys: ApiToken, DbPassword and AppPassword. All three are required. Secrets
      are injected by ECS at task start and never appear in the task definition.

  MicrosoftAppId:
    Type: String
    MinLength: 1
    Description: Bot Framework application ID for the Microsoft Teams channel.
  MicrosoftAppTenantId:
    Type: String
    MinLength: 1
    Description: Entra tenant ID the bot is registered in.
  MicrosoftAppType:
    Type: String
    Default: SingleTenant
    AllowedValues: [SingleTenant, MultiTenant]
    Description: >-
      Bot Framework application type. UserAssignedMSI is not offered: it
      authenticates through an Azure managed identity, which has no AWS
      equivalent.

  TaskCpu:
    Type: String
    Default: '1024'
    AllowedValues: ['512', '1024', '2048', '4096']
  TaskMemory:
    Type: String
    Default: '2048'
  DesiredCount:
    Type: Number
    Default: 1
    MinValue: 1

Resources:
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /ecs/${AWS::StackName}
      RetentionInDays: 14

  # Pulls the image and writes logs.
  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: ecs-tasks.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: read-credentials-secret
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [secretsmanager:GetSecretValue]
                Resource: !Ref CredentialsSecretArn

  # The running container's own role. RegisterUsage is what verifies the AWS
  # Marketplace subscription at start-up; without it the container refuses to run.
  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: ecs-tasks.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: marketplace-metering
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - aws-marketplace:RegisterUsage
                Resource: '*'

  LoadBalancerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub ${AWS::StackName} load balancer
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0

  ServiceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub ${AWS::StackName} tasks
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          SourceSecurityGroupId: !Ref LoadBalancerSecurityGroup

  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Scheme: !Ref LoadBalancerScheme
      Subnets: !Ref SubnetIds
      SecurityGroups: [!Ref LoadBalancerSecurityGroup]

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref VpcId
      # The container runs as an unprivileged user, so nginx binds 8080, not 80.
      Port: 8080
      Protocol: HTTP
      TargetType: ip
      HealthCheckPath: /health
      HealthCheckIntervalSeconds: 30
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher: {HttpCode: '200-399'}
      TargetGroupAttributes:
        # NLSQL keeps conversation state in the task, so a follow-up request must
        # reach the same one.
        - {Key: stickiness.enabled, Value: 'true'}
        - {Key: stickiness.type, Value: lb_cookie}
        - {Key: stickiness.lb_cookie.duration_seconds, Value: '3600'}

  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Ref AWS::StackName
      Cpu: !Ref TaskCpu
      Memory: !Ref TaskMemory
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: nlsql
          Image: !Ref ImageUri
          Essential: true
          PortMappings:
            - {ContainerPort: 8080, Protocol: tcp}
          Environment:
            - {Name: ApiEndPoint,   Value: 'https://api.nlsql.com/googlesheet'}
            - {Name: StaticEndPoint, Value: !Sub 'https://${Distribution.DomainName}'}
            - {Name: DatabaseType,  Value: !Ref DatabaseType}
            - {Name: DataSource,    Value: !Ref DataSource}
            - {Name: DbName,        Value: !Ref DbName}
            - {Name: DbPort,        Value: !Ref DbPort}
            - {Name: DbSchema,      Value: !Ref DbSchema}
            - {Name: DbUser,        Value: !Ref DbUser}
            # Snowflake only. The connector reads the account identifier from
            # DataSource, but the pre-flight check looks for Account by name, so
            # both have to be present or a Snowflake deployment refuses to start.
            - {Name: Account,       Value: !Ref DataSource}
            - {Name: Warehouse,     Value: !Ref Warehouse}
            - {Name: ssl,           Value: 'True'}
            - {Name: PYTHONUNBUFFERED, Value: '1'}
            - {Name: MicrosoftAppId,       Value: !Ref MicrosoftAppId}
            - {Name: MicrosoftAppTenantId, Value: !Ref MicrosoftAppTenantId}
            - {Name: MicrosoftAppType,     Value: !Ref MicrosoftAppType}
            # Without this the application's entitlement check no-ops and AWS
            # meters nothing, which under hourly pricing means no revenue.
            - {Name: AWS_MARKETPLACE_PRODUCT_CODE, Value: '80vvvie6oupr9etlhimecwmkj'}
          Secrets:
            - {Name: ApiToken,    ValueFrom: !Sub '${CredentialsSecretArn}:ApiToken::'}
            - {Name: DbPassword,  ValueFrom: !Sub '${CredentialsSecretArn}:DbPassword::'}
            - {Name: AppPassword, ValueFrom: !Sub '${CredentialsSecretArn}:AppPassword::'}
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: nlsql

  # HTTPS at the edge using CloudFront's own certificate, mirroring the
  # Terraform stacks. Microsoft Bot Framework will not accept a plain HTTP
  # messaging endpoint, and the load balancer has no certificate of its own, so
  # without this the mandatory Teams channel cannot be registered at all.
  Distribution:
    Type: AWS::CloudFront::Distribution
    DependsOn: Listener
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub '${AWS::StackName} NLSQL'
        PriceClass: PriceClass_100
        IPV6Enabled: false
        DefaultRootObject: index.html
        Origins:
          - Id: nlsql-alb
            DomainName: !GetAtt LoadBalancer.DNSName
            CustomOriginConfig:
              HTTPPort: 80
              HTTPSPort: 443
              # CloudFront reaches the load balancer over HTTP inside AWS; the
              # certificate the buyer's browser and Bot Framework see is
              # CloudFront's own.
              OriginProtocolPolicy: http-only
              OriginSSLProtocols: [TLSv1.2]
              OriginKeepaliveTimeout: 60
              OriginReadTimeout: 60
        DefaultCacheBehavior:
          TargetOriginId: nlsql-alb
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [DELETE, GET, HEAD, OPTIONS, PATCH, POST, PUT]
          CachedMethods: [GET, HEAD]
          Compress: false
          # Nothing here is cacheable - this distribution exists only to
          # terminate TLS. Cookies are forwarded because the target group uses
          # lb_cookie stickiness for conversation state, and query strings
          # because the application reads them.
          MinTTL: 0
          DefaultTTL: 0
          MaxTTL: 0
          ForwardedValues:
            QueryString: true
            Headers: [Host, Authorization, Content-Type, Origin, Referer]
            Cookies:
              Forward: all
        ViewerCertificate:
          CloudFrontDefaultCertificate: true
          MinimumProtocolVersion: TLSv1.2_2021

  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Ref AWS::StackName

  Service:
    Type: AWS::ECS::Service
    DependsOn: Listener
    Properties:
      Cluster: !Ref Cluster
      LaunchType: FARGATE
      DesiredCount: !Ref DesiredCount
      TaskDefinition: !Ref TaskDefinition
      NetworkConfiguration:
        AwsvpcConfiguration:
          Subnets: !Ref SubnetIds
          SecurityGroups: [!Ref ServiceSecurityGroup]
          AssignPublicIp: ENABLED
      LoadBalancers:
        - ContainerName: nlsql
          ContainerPort: 8080
          TargetGroupArn: !Ref TargetGroup

Outputs:
  ApplicationUrl:
    Description: >-
      HTTPS URL NLSQL is reachable on. Register the Microsoft Teams messaging
      endpoint as this URL with /api/messages appended.
    Value: !Sub 'https://${Distribution.DomainName}/'
  MessagingEndpoint:
    Description: Set this as the messaging endpoint of your Azure Bot resource.
    Value: !Sub 'https://${Distribution.DomainName}/api/messages'
  HealthCheck:
    Value: !Sub 'https://${Distribution.DomainName}/health'
  LoadBalancerUrl:
    Description: The load balancer behind CloudFront. Plain HTTP - not for Bot Framework.
    Value: !Sub 'http://${LoadBalancer.DNSName}/'
  LogGroupName:
    Value: !Ref LogGroup
